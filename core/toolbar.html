<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { background: transparent; height: 100%; overflow: hidden; }
  #bar {
    box-sizing: border-box;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; gap: 2px;
    padding: 0 8px;
    border-radius: var(--radius-xl);
    border: 1px solid var(--overlay-border);
    background: var(--overlay-panel);
    color: var(--overlay-foreground);
    box-shadow: 0 20px 40px rgba(0,0,0,.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    -webkit-app-region: drag;
    cursor: grab;
  }
  #brand { display: flex; align-items: center; gap: 6px; padding: 0 6px 0 2px; flex-shrink: 0; }
  .sep { width: 1px; height: 22px; background: var(--overlay-border); margin: 0 2px; flex-shrink: 0; -webkit-app-region: no-drag; }
  button { -webkit-app-region: no-drag; }
</style>
</head>
<body>
  <div id="bar">
    <div id="brand">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 4.5 L3 19.5 L9 15 L9 9 L15 9 L21 4.5 Z" class="lm-a"/>
          <path d="M9 15 L21 15 L15 19.5 L9 19.5 Z" class="lm-b"/>
        </svg>
      </span>
    </div>
    <span class="sep"></span>
    <button class="icon-btn" id="btnNotepad" title="VOD notepad" aria-label="VOD notepad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <button class="icon-btn" id="btnScratch" title="Scratch notepad" aria-label="Scratch notepad">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 3H8a2 2 0 00-2 2v14a2 2 0 002 2h13V3z"/><path d="M6 3v18"/></svg>
    </button>
    <button class="icon-btn" id="btnSessions" title="Session history" aria-label="Session history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
    </button>
    <button class="icon-btn" id="btnBrowser" title="Browser" aria-label="Browser">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3 4 6 4 9s-1 6-4 9"/><path d="M12 3c-3 3-4 6-4 9s1 6 4 9"/></svg>
    </button>
    <span class="sep"></span>
    <button class="icon-btn" id="btnRound" title="Manual round bump" aria-label="Manual round bump">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 5l7 7-7 7M5 12h14"/></svg>
    </button>
    <button class="icon-btn" id="btnLock" title="Lock/unlock window position &amp; size" aria-label="Lock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 118 0v4"/></svg>
    </button>
    <button class="icon-btn" id="btnTheme" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <span class="sep"></span>
    <button class="icon-btn danger" id="btnQuit" title="Close overlay" aria-label="Close overlay">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <script src="theme-runtime.js"></script>
  <script>
    document.getElementById('btnNotepad').addEventListener('click', () => window.toolbarApi.openNotepad());
    document.getElementById('btnScratch').addEventListener('click', () => window.toolbarApi.openScratch());
    document.getElementById('btnSessions').addEventListener('click', () => window.toolbarApi.openSessions());
    document.getElementById('btnBrowser').addEventListener('click', () => window.toolbarApi.openBrowser());
    document.getElementById('btnRound').addEventListener('click', () => window.toolbarApi.manualRound());
    document.getElementById('btnLock').addEventListener('click', () => window.toolbarApi.toggleLock());
    document.getElementById('btnTheme').addEventListener('click', () => window.toolbarApi.toggleTheme());
    document.getElementById('btnQuit').addEventListener('click', () => window.toolbarApi.closeOverlay());

    window.toolbarApi.onTheme((theme) => applyTheme(theme));

    window.toolbarApi.onLockState((locked) => {
      document.getElementById('btnLock').classList.toggle('active', locked);
    });
  </script>
</body>
</html>
