<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:transparent; }
  #dim {
    width:100%; height:100%;
    background: rgba(0,0,0,0.6);
    cursor: default;
  }
</style>
</head>
<body>
<div id="dim"></div>
<script>
  // Clicking empty backdrop space (i.e. not on any panel window, since
  // those are separate windows stacked above this one) closes the whole
  // overlay -- same gesture as Steam's overlay.
  document.getElementById('dim').addEventListener('click', () => {
    window.backdropApi.notifyClick();
  });
</script>
</body>
</html>
