name: Standalone unit tests

on:
  pull_request:
    paths:
      - "core/**"
      - "providers/standalone/**"
      - ".github/workflows/standalone-unit-tests.yml"
  push:
    branches:
      - main
    paths:
      - "core/**"
      - "providers/standalone/**"
      - ".github/workflows/standalone-unit-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run standalone unit tests
        working-directory: providers/standalone
        run: npm test
